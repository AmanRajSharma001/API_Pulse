<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApiPulse Dashboard</title>
    <link rel="stylesheet" href="/dashboard.css">
    <script src="/dashboard.js" defer></script>
</head>
<body>
    <h1>ApiPulse</h1>
    <p>API Monitoring Dashboard</p>

    <section>
        <h2>Total Requests</h2>
        <p id="totalRequests">0</p>
    </section>

    <section>
        <h2>Average Response Time</h2>
        <p id="averageResponseTime">0 ms</p>
    </section>

    <section>
        <h2>Successful Requests (2xx)</h2>
        <p id="status2xx">0</p>
    </section>

    <section>
        <h2>Client Errors (4xx)</h2>
        <p id="status4xx">0</p>
    </section>

    <section>
        <h2>Server Errors (5xx)</h2>
        <p id="status5xx">0</p>
    </section>
</body>
</html>
